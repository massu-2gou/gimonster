<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ギモンスターと考えよう</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a0a00;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DotGothic16', monospace;
    color: #fff;
  }

  /* ===== セットアップ ===== */
  #setup-screen {
    background: #000;
    border: 4px solid #fff;
    padding: 36px 32px;
    max-width: 520px;
    width: 92%;
    text-align: center;
  }
  #setup-screen h1 { font-size: 24px; color: #FFD700; margin-bottom: 28px; line-height: 1.6; }
  .setup-field { margin-bottom: 20px; text-align: left; }
  .setup-field label { display: block; font-size: 15px; color: #aaa; margin-bottom: 8px; }
  .setup-field input, .setup-field textarea {
    width: 100%; background: #111; border: 2px solid #555; color: #fff;
    font-family: 'DotGothic16', monospace; font-size: 17px; padding: 12px; outline: none;
  }
  .setup-field input:focus, .setup-field textarea:focus { border-color: #FFD700; }
  .setup-field textarea { min-height: 90px; resize: vertical; }
  #start-btn {
    margin-top: 8px; width: 100%; background: #FFD700; color: #000; border: none;
    font-family: 'DotGothic16', monospace; font-size: 18px; padding: 16px; cursor: pointer;
  }
  #start-btn:hover { background: #ffe54d; }
  #start-btn:disabled { background: #555; color: #888; cursor: default; }

  /* ===== ゲーム画面 ===== */
  #game-screen { display: none; width: 100%; max-width: 720px; }

  .field {
    position: relative; width: 100%; aspect-ratio: 2 / 1;
    background: #1a3a00 url('field1.jpg') center/cover no-repeat;
    image-rendering: pixelated;
  }

  /* HPゲージ */
  .hp-bar-wrap {
    position: absolute; top: 10px; right: 12px;
    background: rgba(0,0,0,0.75); border: 2px solid #fff;
    padding: 6px 10px; min-width: 160px;
  }
  .hp-label { font-size: 11px; color: #aaa; margin-bottom: 4px; }
  .hp-bar-bg { background: #333; height: 12px; width: 100%; }
  .hp-bar-fg {
    height: 12px; background: #4cff4c; width: 100%;
    transition: width 0.6s ease, background 0.6s ease;
  }
  .hp-bar-fg.mid { background: #FFD700; }
  .hp-bar-fg.low { background: #ff4444; }
  .hp-num { font-size: 12px; color: #fff; margin-top: 3px; text-align: right; }

  /* ヒントポイント */
  .hint-pts-wrap {
    position: absolute; top: 10px; left: 12px;
    background: rgba(0,0,0,0.75); border: 2px solid #fff;
    padding: 6px 10px; font-size: 13px; color: #fff; z-index: 10;
  }
  .hint-pts-label { font-size: 11px; color: #aaa; margin-bottom: 2px; }

  /* きろくボタン */
  #log-btn {
    position: absolute; bottom: 10px; left: 12px;
    background: rgba(0,0,0,0.75); border: 2px solid #fff; color: #fff;
    font-family: 'DotGothic16', monospace; font-size: 13px;
    padding: 5px 10px; cursor: pointer; z-index: 10;
  }
  #log-btn:hover { border-color: #FFD700; color: #FFD700; }

  .enemy-wrap {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -60%);
  }
  #enemy-img { width: 180px; height: 180px; image-rendering: pixelated; display: block; }
  .enemy-wrap.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100%{transform:translate(-50%,-60%)}
    25%{transform:translate(calc(-50% - 10px),-60%)}
    75%{transform:translate(calc(-50% + 10px),-60%)}
  }
  .enemy-wrap.bounce { animation: bounce 0.5s; }
  @keyframes bounce {
    0%,100%{transform:translate(-50%,-60%)}
    50%{transform:translate(-50%,calc(-60% - 20px))}
  }
  /* やられ演出 */
  #enemy-img.defeated { animation: defeated 0.8s forwards; }
  @keyframes defeated {
    0%{opacity:1;transform:scale(1)}
    50%{opacity:0.3;transform:scale(1.2)}
    100%{opacity:0;transform:scale(0.5)}
  }

  /* テキストウィンドウ */
  .text-window {
    background: #000; border: 4px solid #fff; border-top: none;
    padding: 20px 24px 18px; min-height: 140px; position: relative;
  }
  .speaker-label { font-size: 14px; color: #FFD700; margin-bottom: 8px; }
  #dialog-text { font-size: 18px; line-height: 2.0; color: #fff; min-height: 72px; white-space: pre-wrap; }
  #next-arrow {
    position: absolute; bottom: 14px; right: 18px; font-size: 22px; color: #FFD700;
    animation: blink 0.8s step-end infinite; display: none;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #loading-dots { color: #aaa; font-size: 16px; display: none; min-height: 72px; padding-top: 8px; }

  /* 入力エリア */
  .input-area {
    background: #111; border: 4px solid #fff; border-top: 2px solid #444;
    display: none; padding: 14px 16px; gap: 10px; align-items: center;
  }
  .input-area.visible { display: flex; }
  #user-input {
    flex: 1; background: #000; border: 2px solid #555; color: #fff;
    font-family: 'DotGothic16', monospace; font-size: 17px; padding: 12px; outline: none;
  }
  #user-input:focus { border-color: #FFD700; }
  #send-btn {
    background: #FFD700; color: #000; border: none;
    font-family: 'DotGothic16', monospace; font-size: 16px;
    padding: 12px 20px; cursor: pointer; white-space: nowrap;
  }
  #send-btn:disabled { background: #555; color: #888; cursor: default; }
  /* ヒントボタン */
  #hint-btn {
    background: #1a6a1a; color: #fff; border: 2px solid #4cff4c;
    font-family: 'DotGothic16', monospace; font-size: 14px;
    padding: 12px 14px; cursor: pointer; white-space: nowrap;
  }
  #hint-btn:disabled { background: #333; color: #555; border-color: #444; cursor: default; }
  #hint-btn:not(:disabled):hover { background: #2a8a2a; }

  /* ===== 振り返りオーバーレイ ===== */
  #log-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.92); z-index: 200;
    flex-direction: column; align-items: center; padding: 24px 16px;
  }
  #log-overlay.show { display: flex; }
  .log-header {
    width: 100%; max-width: 680px; display: flex;
    justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  .log-title { font-size: 18px; color: #FFD700; }
  #log-close-btn {
    background: none; border: 2px solid #fff; color: #fff;
    font-family: 'DotGothic16', monospace; font-size: 14px; padding: 6px 14px; cursor: pointer;
  }
  #log-close-btn:hover { border-color: #FFD700; color: #FFD700; }
  .log-topic { width: 100%; max-width: 680px; font-size: 13px; color: #aaa; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #333; }
  .log-scroll { width: 100%; max-width: 680px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; padding-bottom: 16px; }
  .log-entry { display: flex; flex-direction: column; gap: 4px; }
  .log-entry-label { font-size: 12px; color: #888; }
  .log-entry-label.gimo { color: #FFD700; }
  .log-entry-bubble { font-size: 15px; line-height: 1.8; padding: 12px 14px; border-left: 3px solid #555; color: #ddd; white-space: pre-wrap; }
  .log-entry-bubble.gimo { border-left-color: #FFD700; color: #fff; }
  .log-entry-bubble.user { border-left-color: #8ECAE6; color: #8ECAE6; }

  /* ===== クリア画面 ===== */
  #clear-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.88); align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; z-index: 100;
  }
  #clear-overlay.show { display: flex; }
  .clear-title { font-size: 30px; color: #FFD700; text-align: center; line-height: 1.7; }
  .clear-stats {
    background: #111; border: 2px solid #555; padding: 16px 28px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .clear-stat { font-size: 15px; color: #ccc; display: flex; justify-content: space-between; gap: 24px; }
  .clear-stat span { color: #FFD700; }
  .clear-rank { font-size: 36px; text-align: center; margin: 4px 0; }
  .clear-sub { font-size: 13px; color: #888; text-align: center; }
  .clear-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .clear-btns button {
    background: #fff; color: #000; border: none;
    font-family: 'DotGothic16', monospace; font-size: 15px;
    padding: 12px 24px; cursor: pointer;
  }
  .clear-btns button.sub { background: #333; color: #fff; }
  .clear-btns button:hover { opacity: 0.85; }
</style>
</head>
<body>

<!-- セットアップ -->
<div id="setup-screen">
  <h1>⚔ ギモンスターと<br>考えよう！</h1>
  <div class="setup-field">
    <label for="student-name">きみのなまえ</label>
    <input type="text" id="student-name" placeholder="例：たろう">
  </div>
  <div class="setup-field">
    <label for="topic">きょうの課題</label>
    <textarea id="topic" placeholder="例：なぜ生き物には筋肉があるのか"></textarea>
  </div>
  <button id="start-btn" onclick="startGame()">ぼうけんをはじめる！</button>
</div>

<!-- ゲーム画面 -->
<div id="game-screen">
  <div class="field">
    <!-- ヒントポイント -->
    <div class="hint-pts-wrap">
      <div class="hint-pts-label">ヒントポイント</div>
      <div id="hint-pts-display">💡💡💡</div>
    </div>
    <!-- HPゲージ -->
    <div class="hp-bar-wrap">
      <div class="hp-label">ギモンスター HP</div>
      <div class="hp-bar-bg"><div class="hp-bar-fg" id="hp-bar"></div></div>
      <div class="hp-num" id="hp-num">100 / 100</div>
    </div>
    <!-- きろくボタン -->
    <button id="log-btn" onclick="openLog()">📜 きろく</button>

    <div class="enemy-wrap" id="enemy-wrap">
      <img id="enemy-img" src="enemy1.png" alt="ギモンスター">
    </div>
  </div>

  <div class="text-window">
    <div class="speaker-label" id="speaker-label">ギモンスター</div>
    <div id="dialog-text"></div>
    <div id="loading-dots">ギモンスターが考え中…</div>
    <div id="next-arrow">▼</div>
  </div>

  <div class="input-area" id="input-area">
    <button id="hint-btn" onclick="useHint()">💡ヒント</button>
    <input type="text" id="user-input" placeholder="きみの考えを書こう" maxlength="200">
    <button id="send-btn" onclick="sendMessage()">送る</button>
  </div>
</div>

<!-- 振り返り -->
<div id="log-overlay">
  <div class="log-header">
    <div class="log-title">📜 かいわのきろく</div>
    <button id="log-close-btn" onclick="closeLog()">とじる</button>
  </div>
  <div class="log-topic" id="log-topic"></div>
  <div class="log-scroll" id="log-scroll"></div>
</div>

<!-- クリア -->
<div id="clear-overlay">
  <div class="clear-title">✨ 大正解！！ ✨<br>ギモンスターを倒した！</div>
  <div class="clear-stats">
    <div class="clear-stat">こたえるまでのターン数<span id="result-turns">-</span></div>
    <div class="clear-stat">ヒント使用回数<span id="result-hints">-</span></div>
    <div class="clear-stat">のこりHP<span id="result-hp">-</span></div>
  </div>
  <div class="clear-rank" id="result-rank"></div>
  <div class="clear-sub" id="result-sub"></div>
  <div class="clear-btns">
    <button onclick="openLog()">📜 かいわをみる</button>
    <button class="sub" onclick="location.reload()">もう一度あそぶ</button>
  </div>
</div>

<script>
  // ===== 設定 =====
  const WORKER_URL = "https://gimonster.ryuvow.workers.dev/"; // ★ CloudflareワーカーのURLをここに入れる
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwOmvOxUdtXTtD-TnrmxqeJohSk-tD6HTvs_-jI0LpGDdBHRuel_HXT3RyzwysT4vM/exec"; // ★ GASのWebAppのURL（記録用）
  const HP_MAX = 100;
  const HP_PER_TURN = 8;   // 1ターンごとに減るHP（ヒントは減らない）
  const HINT_MAX = 3;
  const TURN_LIMIT = Math.floor(HP_MAX / HP_PER_TURN); // HPが0になるターン数
  // ================

  let conversationHistory = [];
  let studentName = "";
  let topic = "";
  let turnCount = 0;
  let hintUsed = 0;
  let hp = HP_MAX;
  let chatLog = [];

  let pendingPages = [];
  let currentPage = 0;
  let isTyping = false;
  let typingTimer = null;
  let waitingForNext = false;
  let isClearPending = false;

  // ===== HP管理 =====
  function updateHp(newHp) {
    hp = Math.max(0, newHp);
    const pct = hp / HP_MAX * 100;
    const bar = document.getElementById('hp-bar');
    bar.style.width = pct + '%';
    bar.className = 'hp-bar-fg' + (pct > 50 ? '' : pct > 25 ? ' mid' : ' low');
    document.getElementById('hp-num').textContent = hp + ' / ' + HP_MAX;
  }

  function damageHp() {
    updateHp(hp - HP_PER_TURN);
  }

  // ===== ヒントポイント管理 =====
  function updateHintDisplay() {
    const remaining = HINT_MAX - hintUsed;
    document.getElementById('hint-pts-display').textContent =
      '💡'.repeat(remaining) + '　'.repeat(hintUsed);
    document.getElementById('hint-btn').disabled = remaining <= 0;
  }

  function useHint() {
    if (hintUsed >= HINT_MAX) return;
    hintUsed++;
    updateHintDisplay();
    // 「ヒントをください」としてギモンスターに送信
    const hintText = "わからないので、ヒントをください";
    hideInput();
    // ヒントはターン数もHPも消費しない
    document.getElementById('speaker-label').textContent = studentName;
    document.getElementById('dialog-text').textContent = hintText;
    document.getElementById('next-arrow').style.display = 'none';
    conversationHistory.push({ role: "user", content: hintText });
    addLog('user', studentName, hintText + '（ヒント使用）');
    setTimeout(() => {
      setLoading(true);
      callGimonster(hintText, false);
    }, 600);
  }

  // ===== ゲーム開始 =====
  function startGame() {
    studentName = document.getElementById('student-name').value.trim();
    topic = document.getElementById('topic').value.trim();
    if (!studentName || !topic) { alert('なまえと課題を入力してね！'); return; }
    if (WORKER_URL === "YOUR_WORKER_URL_HERE") { alert('WORKER_URLを設定してください'); return; }

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';

    updateHp(HP_MAX);
    updateHintDisplay();
    setLoading(true);
    callGimonster("（ギモンスターとして、課題「" + topic + "」について元気よく自己紹介し、最初の問いかけをしてください）", true);
  }

  // ===== テキスト表示 =====
  function showReply(text, clearAfter) {
    isClearPending = !!clearAfter;
    pendingPages = splitIntoPages(text);
    currentPage = 0;
    showPage();
  }

  function splitIntoPages(text) {
    const sentences = text.split(/(?<=[。！？\n])/);
    const pages = [];
    let current = "";
    for (const s of sentences) {
      if ((current + s).length > 90 && current.length > 0) {
        pages.push(current.trim());
        current = s;
      } else { current += s; }
    }
    if (current.trim()) pages.push(current.trim());
    return pages.length > 0 ? pages : [text];
  }

  function showPage() {
    if (currentPage >= pendingPages.length) {
      document.getElementById('next-arrow').style.display = 'none';
      if (isClearPending) {
        setTimeout(showClear, 400);
      } else {
        showInput();
      }
      return;
    }
    const pageText = pendingPages[currentPage];
    waitingForNext = false;
    isTyping = true;
    document.getElementById('next-arrow').style.display = 'none';
    document.getElementById('dialog-text').textContent = "";
    let i = 0;
    function typeNext() {
      if (i < pageText.length) {
        document.getElementById('dialog-text').textContent += pageText[i++];
        typingTimer = setTimeout(typeNext, 40);
      } else {
        isTyping = false;
        if (currentPage < pendingPages.length - 1) {
          waitingForNext = true;
          document.getElementById('next-arrow').style.display = 'block';
        } else if (isClearPending) {
          waitingForNext = true;
          document.getElementById('next-arrow').style.display = 'block';
        } else {
          showInput();
        }
      }
    }
    typeNext();
  }

  function advancePage() {
    if (isTyping) {
      clearTimeout(typingTimer);
      isTyping = false;
      document.getElementById('dialog-text').textContent = pendingPages[currentPage];
      if (currentPage < pendingPages.length - 1) {
        waitingForNext = true;
        document.getElementById('next-arrow').style.display = 'block';
      } else if (isClearPending) {
        waitingForNext = true;
        document.getElementById('next-arrow').style.display = 'block';
      } else { showInput(); }
    } else if (waitingForNext) {
      currentPage++;
      showPage();
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
      if (!document.getElementById('input-area').classList.contains('visible')) advancePage();
    }
  });
  document.addEventListener('click', (e) => {
    if (!document.getElementById('input-area').classList.contains('visible') &&
        !e.target.closest('#setup-screen') &&
        !e.target.closest('#clear-overlay') &&
        !e.target.closest('#log-overlay')) {
      advancePage();
    }
  });

  function showInput() {
    document.getElementById('input-area').classList.add('visible');
    document.getElementById('user-input').focus();
  }
  function hideInput() {
    document.getElementById('input-area').classList.remove('visible');
    document.getElementById('user-input').value = '';
  }

  // ===== クリア画面 =====
  function showClear() {
    // やられ演出
    document.getElementById('enemy-img').classList.add('defeated');

    // ランク計算
    let rank, rankColor;
    if (hintUsed === 0 && turnCount <= 5) { rank = '★★★ S'; rankColor = '#FFD700'; }
    else if (hintUsed === 0) { rank = '★★☆ A'; rankColor = '#4cff4c'; }
    else if (hintUsed <= 1) { rank = '★☆☆ B'; rankColor = '#8ECAE6'; }
    else { rank = '☆☆☆ C'; rankColor = '#aaa'; }

    document.getElementById('result-turns').textContent = turnCount + ' ターン';
    document.getElementById('result-hints').textContent = hintUsed + ' 回';
    document.getElementById('result-hp').textContent = hp;
    const rankEl = document.getElementById('result-rank');
    rankEl.textContent = rank;
    rankEl.style.color = rankColor;
    document.getElementById('result-sub').textContent =
      studentName + 'は「' + topic + '」の答えにたどり着いた！';
    document.getElementById('clear-overlay').classList.add('show');
  }

  // ===== メッセージ送信 =====
  document.getElementById('user-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendMessage(); }
  });

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text || document.getElementById('send-btn').disabled) return;
    // HP0（ターン上限）に達していたら入力を受け付けない
    if (hp <= 0) { return; }

    hideInput();
    turnCount++;
    damageHp();

    document.getElementById('speaker-label').textContent = studentName;
    document.getElementById('dialog-text').textContent = text;
    document.getElementById('next-arrow').style.display = 'none';
    conversationHistory.push({ role: "user", content: text });
    addLog('user', studentName, text);

    await new Promise(r => setTimeout(r, 700));
    setLoading(true);
    // HP0フラグを渡す（ギモンスターにまとめを促す）
    await callGimonster(text, false, hp <= 0);
  }

  // ===== API呼び出し =====
  async function callGimonster(userText, isFirstMessage, isLastTurn = false) {
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          topic,
          messages: isFirstMessage
            ? [{ role: "user", content: userText }]
            : conversationHistory,
          isLastTurn
        })
      });
      const data = await res.json();
      setLoading(false);

      if (data.result === "error") {
        showSystemMessage("エラーが起きたギモ…先生に伝えてほしいギモ。"); return;
      }

      const rawReply = data.reply;
      const isClear = rawReply.includes("###CLEAR###");
      const reply = rawReply.replace("###CLEAR###", "").trim();

      conversationHistory.push({ role: "assistant", content: reply });
      addLog('gimo', 'ギモンスター', reply);
      logToSheet(userText, reply);

      document.getElementById('speaker-label').textContent = "ギモンスター";
      const wrap = document.getElementById('enemy-wrap');
      wrap.classList.remove('shake', 'bounce');
      void wrap.offsetWidth;
      wrap.classList.add(isClear ? 'bounce' : 'shake');

      // クリア時はHPを0に
      if (isClear) updateHp(0);

      showReply(reply, isClear);
    } catch (err) {
      setLoading(false);
      showSystemMessage("通信エラーが起きたギモ…ネットワークを確認してほしいギモ。");
      console.error(err);
    }
  }

  function setLoading(isLoading) {
    document.getElementById('loading-dots').style.display = isLoading ? 'block' : 'none';
    document.getElementById('dialog-text').style.display = isLoading ? 'none' : 'block';
    if (isLoading) {
      document.getElementById('speaker-label').textContent = "ギモンスター";
      document.getElementById('next-arrow').style.display = 'none';
    }
    document.getElementById('send-btn').disabled = isLoading;
  }

  function showSystemMessage(msg) {
    document.getElementById('speaker-label').textContent = "システム";
    document.getElementById('dialog-text').textContent = msg;
    showInput();
  }

  // ===== ログ =====
  function addLog(role, name, text) { chatLog.push({ role, name, text }); }

  function openLog() {
    document.getElementById('log-topic').textContent = '課題：' + topic;
    const scroll = document.getElementById('log-scroll');
    scroll.innerHTML = '';
    if (chatLog.length === 0) {
      scroll.innerHTML = '<div style="color:#aaa;font-size:14px;">まだかいわがありません</div>';
    } else {
      chatLog.forEach(entry => {
        const div = document.createElement('div');
        div.className = 'log-entry';
        const label = document.createElement('div');
        label.className = 'log-entry-label' + (entry.role === 'gimo' ? ' gimo' : '');
        label.textContent = entry.name;
        const bubble = document.createElement('div');
        bubble.className = 'log-entry-bubble ' + entry.role;
        bubble.textContent = entry.text;
        div.appendChild(label);
        div.appendChild(bubble);
        scroll.appendChild(div);
      });
      scroll.scrollTop = scroll.scrollHeight;
    }
    document.getElementById('log-overlay').classList.add('show');
  }

  function closeLog() { document.getElementById('log-overlay').classList.remove('show'); }

  function logToSheet(userText, gimoReply) {
    if (!GAS_WEBAPP_URL || GAS_WEBAPP_URL === "YOUR_GAS_WEBAPP_URL_HERE") return;
    fetch(GAS_WEBAPP_URL, {
      method: "POST", mode: "no-cors",
      body: JSON.stringify({ action:"log", timestamp:new Date().toISOString(), studentName, topic, turnCount, hintUsed, userText, gimoReply })
    }).catch(() => {});
  }
</script>
</body>
</html>

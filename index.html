<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ギモンスターと考えよう</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a0a00;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DotGothic16', monospace;
    color: #fff;
  }

  /* ===== セットアップ画面 ===== */
  #setup-screen {
    background: #000;
    border: 4px solid #fff;
    padding: 36px 32px;
    max-width: 520px;
    width: 92%;
    text-align: center;
  }
  #setup-screen h1 {
    font-size: 24px;
    color: #FFD700;
    margin-bottom: 28px;
    line-height: 1.6;
  }
  .setup-field { margin-bottom: 20px; text-align: left; }
  .setup-field label {
    display: block;
    font-size: 15px;
    color: #aaa;
    margin-bottom: 8px;
  }
  .setup-field input,
  .setup-field textarea {
    width: 100%;
    background: #111;
    border: 2px solid #555;
    color: #fff;
    font-family: 'DotGothic16', monospace;
    font-size: 17px;
    padding: 12px;
    outline: none;
  }
  .setup-field input:focus,
  .setup-field textarea:focus { border-color: #FFD700; }
  .setup-field textarea { min-height: 90px; resize: vertical; }
  #start-btn {
    margin-top: 8px;
    width: 100%;
    background: #FFD700;
    color: #000;
    border: none;
    font-family: 'DotGothic16', monospace;
    font-size: 18px;
    padding: 16px;
    cursor: pointer;
  }
  #start-btn:hover { background: #ffe54d; }
  #start-btn:disabled { background: #555; color: #888; cursor: default; }

  /* ===== ゲーム画面 ===== */
  #game-screen { display: none; width: 100%; max-width: 720px; }

  /* 上半分：フィールド */
  .field {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 1;
    background: #1a3a00 url('field1.jpg') center/cover no-repeat;
    image-rendering: pixelated;
  }
  .enemy-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
  }
  #enemy-img {
    width: 180px;
    height: 180px;
    image-rendering: pixelated;
    display: block;
  }
  .enemy-wrap.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100%{transform:translate(-50%,-60%)}
    25%{transform:translate(calc(-50% - 10px),-60%)}
    75%{transform:translate(calc(-50% + 10px),-60%)}
  }
  .enemy-wrap.bounce { animation: bounce 0.5s; }
  @keyframes bounce {
    0%,100%{transform:translate(-50%,-60%)}
    50%{transform:translate(-50%,calc(-60% - 20px))}
  }

  /* ターンカウンター */
  .turn-badge {
    position: absolute;
    top: 10px;
    right: 12px;
    background: rgba(0,0,0,0.75);
    border: 2px solid #FFD700;
    color: #FFD700;
    font-size: 14px;
    padding: 5px 12px;
  }

  /* テキストウィンドウ */
  .text-window {
    background: #000;
    border: 4px solid #fff;
    border-top: none;
    padding: 20px 24px 18px;
    min-height: 140px;
    position: relative;
  }
  .speaker-label {
    font-size: 14px;
    color: #FFD700;
    margin-bottom: 8px;
  }
  #dialog-text {
    font-size: 18px;
    line-height: 2.0;
    color: #fff;
    min-height: 72px;
    white-space: pre-wrap;
  }
  #next-arrow {
    position: absolute;
    bottom: 14px;
    right: 18px;
    font-size: 22px;
    color: #FFD700;
    animation: blink 0.8s step-end infinite;
    display: none;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #loading-dots {
    color: #aaa;
    font-size: 16px;
    display: none;
    min-height: 72px;
    padding-top: 8px;
  }

  /* 入力エリア */
  .input-area {
    background: #111;
    border: 4px solid #fff;
    border-top: 2px solid #444;
    display: none;
    padding: 14px 16px;
    gap: 10px;
    align-items: center;
  }
  .input-area.visible { display: flex; }
  #user-input {
    flex: 1;
    background: #000;
    border: 2px solid #555;
    color: #fff;
    font-family: 'DotGothic16', monospace;
    font-size: 17px;
    padding: 12px;
    outline: none;
  }
  #user-input:focus { border-color: #FFD700; }
  #send-btn {
    background: #FFD700;
    color: #000;
    border: none;
    font-family: 'DotGothic16', monospace;
    font-size: 16px;
    padding: 12px 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  #send-btn:disabled { background: #555; color: #888; cursor: default; }

  /* きろくボタン */
  #log-btn {
    position: absolute;
    top: 10px;
    left: 12px;
    background: rgba(0,0,0,0.75);
    border: 2px solid #fff;
    color: #fff;
    font-family: 'DotGothic16', monospace;
    font-size: 13px;
    padding: 5px 10px;
    cursor: pointer;
    z-index: 10;
  }
  #log-btn:hover { border-color: #FFD700; color: #FFD700; }

  /* 振り返りオーバーレイ */
  #log-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  #log-overlay.show { display: flex; }
  .log-header {
    width: 100%;
    max-width: 680px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .log-title { font-size: 18px; color: #FFD700; }
  #log-close-btn {
    background: none;
    border: 2px solid #fff;
    color: #fff;
    font-family: 'DotGothic16', monospace;
    font-size: 14px;
    padding: 6px 14px;
    cursor: pointer;
  }
  #log-close-btn:hover { border-color: #FFD700; color: #FFD700; }
  .log-topic {
    width: 100%;
    max-width: 680px;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #333;
  }
  .log-scroll {
    width: 100%;
    max-width: 680px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-bottom: 16px;
  }
  .log-entry { display: flex; flex-direction: column; gap: 4px; }
  .log-entry-label { font-size: 12px; color: #888; }
  .log-entry-label.gimo { color: #FFD700; }
  .log-entry-bubble {
    font-size: 15px;
    line-height: 1.8;
    padding: 12px 14px;
    border-left: 3px solid #555;
    color: #ddd;
    white-space: pre-wrap;
  }
  .log-entry-bubble.gimo { border-left-color: #FFD700; color: #fff; }
  .log-entry-bubble.user { border-left-color: #8ECAE6; color: #8ECAE6; }

  /* 正解演出 */
  #clear-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    z-index: 100;
  }
  #clear-overlay.show { display: flex; }
  .clear-title {
    font-size: 32px;
    color: #FFD700;
    text-align: center;
    line-height: 1.7;
  }
  .clear-sub {
    font-size: 16px;
    color: #ccc;
    text-align: center;
  }
  #retry-btn {
    margin-top: 8px;
    background: #FFD700;
    color: #000;
    border: none;
    font-family: 'DotGothic16', monospace;
    font-size: 17px;
    padding: 14px 40px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="setup-screen">
  <h1>⚔ ギモンスターと<br>考えよう！</h1>
  <div class="setup-field">
    <label for="student-name">きみのなまえ</label>
    <input type="text" id="student-name" placeholder="例：たろう">
  </div>
  <div class="setup-field">
    <label for="topic">きょうの課題</label>
    <textarea id="topic" placeholder="例：なぜ生き物には筋肉があるのか"></textarea>
  </div>
  <button id="start-btn" onclick="startGame()">ぼうけんをはじめる！</button>
</div>

<div id="game-screen">
  <div class="field">
    <div class="enemy-wrap" id="enemy-wrap">
      <img id="enemy-img" src="enemy1.png" alt="ギモンスター">
    </div>
  <button id="log-btn" onclick="openLog()">📜 きろく</button>
    <div class="turn-badge" id="turn-badge">ターン 0</div>
  </div>
  <div class="text-window">
    <div class="speaker-label" id="speaker-label">ギモンスター</div>
    <div id="dialog-text"></div>
    <div id="loading-dots">ギモンスターが考え中…</div>
    <div id="next-arrow">▼</div>
  </div>
  <div class="input-area" id="input-area">
    <input type="text" id="user-input" placeholder="きみの考えを書こう" maxlength="200">
    <button id="send-btn" onclick="sendMessage()">送る</button>
  </div>
</div>

<div id="clear-overlay">
  <div class="clear-title">✨ 大正解！！ ✨<br>ギモンスターを倒した！</div>
  <div class="clear-sub" id="clear-sub"></div>
  <button onclick="openLog()" style="background:#fff;color:#000;border:none;font-family:DotGothic16,monospace;font-size:16px;padding:12px 32px;cursor:pointer;">📜 かいわをみる</button><br><button id="retry-btn" onclick="location.reload()">もう一度あそぶ</button>
</div>

<script>

  // ===== 振り返りログ =====
  let chatLog = []; // {role, name, text} の配列

  function addLog(role, name, text) {
    chatLog.push({ role, name, text });
  }

  function openLog() {
    const scroll = document.getElementById('log-scroll');
    const topicEl = document.getElementById('log-topic');
    topicEl.textContent = '課題：' + topic;
    scroll.innerHTML = '';

    if (chatLog.length === 0) {
      scroll.innerHTML = '<div style="color:#aaa;font-size:14px;">まだかいわがありません</div>';
    } else {
      chatLog.forEach((entry) => {
        const div = document.createElement('div');
        div.className = 'log-entry';
        const label = document.createElement('div');
        label.className = 'log-entry-label ' + (entry.role === 'gimo' ? 'gimo' : '');
        label.textContent = entry.name;
        const bubble = document.createElement('div');
        bubble.className = 'log-entry-bubble ' + entry.role;
        bubble.textContent = entry.text;
        div.appendChild(label);
        div.appendChild(bubble);
        scroll.appendChild(div);
      });
      // 最下部にスクロール
      scroll.scrollTop = scroll.scrollHeight;
    }
    document.getElementById('log-overlay').classList.add('show');
  }

  function closeLog() {
    document.getElementById('log-overlay').classList.remove('show');
  }
  // ===== 設定（ここを書き換えてください） =====
  const WORKER_URL = "https://gimonster.ryuvow.workers.dev/"; // ★ CloudflareワーカーのURLをここに入れる
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwOmvOxUdtXTtD-TnrmxqeJohSk-tD6HTvs_-jI0LpGDdBHRuel_HXT3RyzwysT4vM/exec"; // ★ GASのWebAppのURL（記録用）
  // APIキーはどちらにも書きません。Cloudflare Workerの環境変数に保管します。
  // ============================================

  let conversationHistory = [];
  let studentName = "";
  let topic = "";
  let turnCount = 0;

  let pendingPages = [];
  let currentPage = 0;
  let isTyping = false;
  let typingTimer = null;
  let waitingForNext = false;
  let isClearPending = false; // ★ セリフ読了後にクリア画面を出すフラグ

  // ===== ゲーム開始 =====
  function startGame() {
    studentName = document.getElementById('student-name').value.trim();
    topic = document.getElementById('topic').value.trim();
    if (!studentName || !topic) { alert('なまえと課題を入力してね！'); return; }
    if (WORKER_URL === "YOUR_WORKER_URL_HERE") { alert('WORKER_URLを設定してください'); return; }

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';

    setLoading(true);
    callGimonster("（ギモンスターとして、課題「" + topic + "」について元気よく自己紹介し、最初の問いかけをしてください）", true);
  }

  // ===== テキスト表示 =====
  function showReply(text, clearAfter) {
    isClearPending = !!clearAfter;
    pendingPages = splitIntoPages(text);
    currentPage = 0;
    showPage();
  }

  function splitIntoPages(text) {
    const sentences = text.split(/(?<=[。！？\n])/);
    const pages = [];
    let current = "";
    for (const s of sentences) {
      if ((current + s).length > 90 && current.length > 0) {
        pages.push(current.trim());
        current = s;
      } else {
        current += s;
      }
    }
    if (current.trim()) pages.push(current.trim());
    return pages.length > 0 ? pages : [text];
  }

  function showPage() {
    if (currentPage >= pendingPages.length) {
      document.getElementById('next-arrow').style.display = 'none';
      // ★ クリアフラグが立っていればクリア画面、そうでなければ入力開放
      if (isClearPending) {
        setTimeout(() => {
          document.getElementById('clear-sub').textContent =
            studentName + 'は「' + topic + '」の答えにたどり着いた！';
          document.getElementById('clear-overlay').classList.add('show');
        }, 400);
      } else {
        showInput();
      }
      return;
    }

    const pageText = pendingPages[currentPage];
    waitingForNext = false;
    isTyping = true;
    document.getElementById('next-arrow').style.display = 'none';
    document.getElementById('dialog-text').textContent = "";

    let i = 0;
    function typeNext() {
      if (i < pageText.length) {
        document.getElementById('dialog-text').textContent += pageText[i];
        i++;
        typingTimer = setTimeout(typeNext, 40);
      } else {
        isTyping = false;
        if (currentPage < pendingPages.length - 1) {
          waitingForNext = true;
          document.getElementById('next-arrow').style.display = 'block';
        } else {
          // 最終ページ
          if (isClearPending) {
            // クリア時は矢印を出してもう一度押させる
            waitingForNext = true;
            document.getElementById('next-arrow').style.display = 'block';
          } else {
            showInput();
          }
        }
      }
    }
    typeNext();
  }

  function advancePage() {
    if (isTyping) {
      clearTimeout(typingTimer);
      isTyping = false;
      document.getElementById('dialog-text').textContent = pendingPages[currentPage];
      if (currentPage < pendingPages.length - 1) {
        waitingForNext = true;
        document.getElementById('next-arrow').style.display = 'block';
      } else {
        if (isClearPending) {
          waitingForNext = true;
          document.getElementById('next-arrow').style.display = 'block';
        } else {
          showInput();
        }
      }
    } else if (waitingForNext) {
      currentPage++;
      showPage();
    }
  }

  // セリフ送り：Enterキー（変換中は無視）
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.isComposing === false) {
      const inputArea = document.getElementById('input-area');
      if (!inputArea.classList.contains('visible')) {
        advancePage();
      }
    }
  });

  // セリフ送り：画面タップ（入力エリア以外）
  document.addEventListener('click', (e) => {
    const inputArea = document.getElementById('input-area');
    if (!inputArea.classList.contains('visible') &&
        !e.target.closest('#setup-screen') &&
        !e.target.closest('#clear-overlay')) {
      advancePage();
    }
  });

  function showInput() {
    document.getElementById('input-area').classList.add('visible');
    document.getElementById('user-input').focus();
  }
  function hideInput() {
    document.getElementById('input-area').classList.remove('visible');
    document.getElementById('user-input').value = '';
  }

  // ===== メッセージ送信 =====
  // ★ Enterキーで送信（変換中は無視）
  document.getElementById('user-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text || document.getElementById('send-btn').disabled) return;

    hideInput();
    turnCount++;
    document.getElementById('turn-badge').textContent = 'ターン ' + turnCount;

    document.getElementById('speaker-label').textContent = studentName;
    document.getElementById('dialog-text').textContent = text;
    document.getElementById('next-arrow').style.display = 'none';

    conversationHistory.push({ role: "user", content: text });
    addLog('user', studentName, text);

    await new Promise(r => setTimeout(r, 700));
    setLoading(true);
    await callGimonster(text, false);
  }

  // ===== API呼び出し =====
  async function callGimonster(userText, isFirstMessage) {
    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          topic,
          messages: isFirstMessage
            ? [{ role: "user", content: userText }]
            : conversationHistory
        })
      });

      const data = await response.json();
      setLoading(false);

      if (data.result === "error") {
        showSystemMessage("エラーが起きたギモ…先生に伝えてほしいギモ。");
        return;
      }

      const reply = data.reply;
      conversationHistory.push({ role: "assistant", content: reply });
      addLog('gimo', 'ギモンスター', reply);
      logToSheet(userText, reply);

      // ★ 正解判定：フラグとして渡すだけ。セリフ表示は通常通り行う
      const isClear = reply.includes("大正解ギモ");

      document.getElementById('speaker-label').textContent = "ギモンスター";

      const wrap = document.getElementById('enemy-wrap');
      wrap.classList.remove('shake', 'bounce');
      void wrap.offsetWidth;
      wrap.classList.add(isClear ? 'bounce' : 'shake');

      // ★ clearAfterフラグをshowReplyに渡す
      showReply(reply, isClear);

    } catch (err) {
      setLoading(false);
      showSystemMessage("通信エラーが起きたギモ…ネットワークを確認してほしいギモ。");
      console.error(err);
    }
  }

  function setLoading(isLoading) {
    document.getElementById('loading-dots').style.display = isLoading ? 'block' : 'none';
    document.getElementById('dialog-text').style.display = isLoading ? 'none' : 'block';
    if (isLoading) {
      document.getElementById('speaker-label').textContent = "ギモンスター";
      document.getElementById('next-arrow').style.display = 'none';
    }
    document.getElementById('send-btn').disabled = isLoading;
  }

  function showSystemMessage(msg) {
    document.getElementById('speaker-label').textContent = "システム";
    document.getElementById('dialog-text').textContent = msg;
    showInput();
  }

  function logToSheet(userText, gimoReply) {
    if (!GAS_WEBAPP_URL || GAS_WEBAPP_URL === "YOUR_GAS_WEBAPP_URL_HERE") return;
    fetch(GAS_WEBAPP_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({ action:"log", timestamp:new Date().toISOString(), studentName, topic, turnCount, userText, gimoReply })
    }).catch(() => {});
  }
</script>

<div id="log-overlay">
  <div class="log-header">
    <div class="log-title">📜 かいわのきろく</div>
    <button id="log-close-btn" onclick="closeLog()">とじる</button>
  </div>
  <div class="log-topic" id="log-topic"></div>
  <div class="log-scroll" id="log-scroll"></div>
</div>
</body>
</html>
